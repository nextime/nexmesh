[workspace]
resolver = "2"
members = ["crates/proto", "crates/hub", "crates/node", "crates/mcpd", "crates/ctl", "crates/orch"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.75"

[workspace.dependencies]
nexmesh-proto = { path = "crates/proto" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "signal", "time", "sync", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.28"

# hub
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["trace", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"

# node
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
portable-pty = "0.8"
nix = { version = "0.29", features = ["signal", "process"] }

# profile tuned for small static binaries on the odd-ball nodes
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
