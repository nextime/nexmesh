# Codex CLI. Not installed on machine-b -- descriptor shipped so a node that has it
# is picked up automatically, with no hub change.
[cli]
id = "codex"
display_name = "Codex CLI"
command = "codex"
version_args = ["--version"]
# Installed via npm here, like qwen. Without this a node only finds it when it
# happens to be on the service's PATH, which a start-stop-daemon environment is not.
extra_paths = ["~/.npm-global/bin", "~/.local/bin"]
# Codex takes the model in thread/start, so no flag here.

[mcp]
style = "toml_file"
path = "~/.codex/config.toml"
key = "mcp_servers.nexmesh"
env_key = "env"
entry = { command = "{mcpd}", args = [] }

[modes.headless]
# The prompt is NOT passed here or on stdin: it becomes the first
# `turn/start`, which the app_server driver issues after the handshake.
args = ["app-server"]
# The seat's system prompt and the team's standing habits, ADDED as codex's
# `developer_instructions` -- a developer message beside codex's own
# instructions, not in place of them. `-c` is a global flag (its value parsed
# as TOML, hence {prompt_toml}), so it applies after `resume` and to
# `app-server` alike. Checked against codex 0.169 on this fleet.
append_system_prompt_args = ["-c", "developer_instructions={prompt_toml}"]
attachable = false

[modes.interactive]
# A fleet seat has nobody sitting at its keyboard, and codex's default
# approval policy asks before every command AND every MCP tool call -- which
# for a seat on this fleet means the shim's own `claim_messages` raises a
# dialog the moment a teammate writes to it. That dialog then blocks the
# seat: the message is typed into the composer behind it, the Enter answers
# the dialog instead of submitting, and from the outside the agent looks
# like it is ignoring you.
#
# So an interactive seat is launched the way the headless driver already
# starts its threads -- `approvalPolicy: "never"` -- with the sandbox left
# on, which is codex's own documented unattended mode: failures go back to
# the model instead of to a human who is not there.
args = ["--ask-for-approval", "never", "--sandbox", "workspace-write"]
# The seat's system prompt and the team's standing habits, ADDED as codex's
# `developer_instructions` -- a developer message beside codex's own
# instructions, not in place of them. `-c` is a global flag (its value parsed
# as TOML, hence {prompt_toml}), so it applies after `resume` and to
# `app-server` alike. Checked against codex 0.169 on this fleet.
append_system_prompt_args = ["-c", "developer_instructions={prompt_toml}"]
# `codex resume <id>` continues a thread. It is a SUBCOMMAND, so it lands
# after the options above -- verified that clap accepts
# `codex --ask-for-approval never --sandbox workspace-write resume ...`.
#
# This only fires when the hub HAS a handle for the seat, and for an
# interactive codex seat it currently never does: codex exports no session
# id to its MCP children (checked against the real process environment on
# 0.169), takes no session name at launch, and records its threads in a
# store shared by every seat this user runs -- where two seats spawned
# together were 610ms apart with the same cwd, so neither time nor
# directory can tell them apart. Resuming the WRONG conversation is worse
# than starting a fresh one, so nothing guesses. The driven app-server mode
# learns its own thread id over the protocol and does resume.
resume_args = ["resume", "{resume}"]
# With a store of this seat's own (see the session_store section below), "the
# last one" is unambiguously the conversation THIS seat was on, so there is no
# id to learn or record. `resume --last` is codex's own way of saying it.
resume_latest_args = ["resume", "--last"]
# No compact_command: this CLI's compaction command was not verified here --
# neither its --help nor its package names one, and the commands next to it
# (/clear, /new) are destructive, so guessing in that neighbourhood is not
# worth it. `/compact <agent>` reports that rather than typing a guess. Add
# the real command here and it works immediately.
attachable = true
# Typing a line at this prompt is a message to the agent, not a command
# to a shell -- so a seat the fleet put in a terminal can be reached by
# keyboard even with no driver to push to. `tmux` does not say this: what
# is at ITS prompt is a shell.
typed_delivery = true

[driver]
kind = "app_server"

[user_install]
style = "toml_file"
path = "~/.codex/config.toml"
key = "mcp_servers.{name}"
env_key = "env"
entry = { command = "{command}", args = [] }

# No [skill] section: this CLI has no skills directory to write one into. It
# gets the same ground rules through the MCP `instructions` field, which the
# hub sends every client at initialize (see proto::tools::team_instructions).

[session_store]
# A data directory per SEAT, so a codex seat can be resumed at all.
#
# codex 0.169 exports no conversation id to its MCP children (checked against
# the real process environment, not the docs), takes no conversation name at
# launch, and records every seat's threads in one state_*.sqlite with no
# column naming the process that owns them. Two seats spawned together are
# milliseconds apart with the same cwd, so nothing outside codex can tell
# which thread belongs to which seat -- and resuming the WRONG conversation
# is worse than starting a fresh one.
#
# Given its own CODEX_HOME, "the last thread" is this seat's last thread.
#
# Everything in `share` is symlinked out of the real ~/.codex, so the login,
# the configuration, the installed packages, plugins and skills are not
# duplicated and cannot drift. Only the threads are per seat, which is the
# point. An entry that does not exist on a given version is skipped.
env = "CODEX_HOME"
root = "~/.codex"
share = ["auth.json", "auth.json.lock", "auth.lock", "config.toml",
         "packages", "plugins", "skills", "models_cache.json",
         "installation_id", "version.json", "shell_snapshots"]

[context]
# HOW FULL a seat's conversation is: the newest `token_count` event in its own
# rollout (the seat has a store of its own, see session_store). codex writes
# the last call's input and output AND the model's window into that record,
# so the window is read, not declared; this is only the fallback.
source = "codex_rollout"
limit_tokens = 272000
