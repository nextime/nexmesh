# Codex CLI. Not installed on machine-b -- descriptor shipped so a node that has it
# is picked up automatically, with no hub change.
[cli]
id = "codex"
display_name = "Codex CLI"
command = "codex"
version_args = ["--version"]
# Installed via npm here, like qwen. Without this a node only finds it when it
# happens to be on the service's PATH, which a start-stop-daemon environment is not.
extra_paths = ["~/.npm-global/bin", "~/.local/bin"]
# Codex takes the model in thread/start, so no flag here.

[mcp]
style = "toml_file"
path = "~/.codex/config.toml"
key = "mcp_servers.nexmesh"
env_key = "env"
entry = { command = "{mcpd}", args = [] }

[modes.headless]
# The prompt is NOT passed here or on stdin: it becomes the first
# `turn/start`, which the app_server driver issues after the handshake.
args = ["app-server"]
attachable = false

[modes.interactive]
# A fleet seat has nobody sitting at its keyboard, and codex's default
# approval policy asks before every command AND every MCP tool call -- which
# for a seat on this fleet means the shim's own `claim_messages` raises a
# dialog the moment a teammate writes to it. That dialog then blocks the
# seat: the message is typed into the composer behind it, the Enter answers
# the dialog instead of submitting, and from the outside the agent looks
# like it is ignoring you.
#
# So an interactive seat is launched the way the headless driver already
# starts its threads -- `approvalPolicy: "never"` -- with the sandbox left
# on, which is codex's own documented unattended mode: failures go back to
# the model instead of to a human who is not there.
args = ["--ask-for-approval", "never", "--sandbox", "workspace-write"]
attachable = true
# Typing a line at this prompt is a message to the agent, not a command
# to a shell -- so a seat the fleet put in a terminal can be reached by
# keyboard even with no driver to push to. `tmux` does not say this: what
# is at ITS prompt is a shell.
typed_delivery = true

[driver]
kind = "app_server"

[user_install]
style = "toml_file"
path = "~/.codex/config.toml"
key = "mcp_servers.{name}"
env_key = "env"
entry = { command = "{command}", args = [] }
