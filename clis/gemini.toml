# Gemini CLI. Not installed on machine-b.
[cli]
id = "gemini"
display_name = "Gemini CLI"
command = "gemini"
version_args = ["--version"]
# Installed via npm here, like qwen. Without this a node only finds it when it
# happens to be on the service's PATH, which a start-stop-daemon environment is not.
extra_paths = ["~/.npm-global/bin", "~/.local/bin"]
model_args = ["--model", "{model}"]

[mcp]
style = "json_file"
path = "~/.gemini/settings.json"
pointer = "/mcpServers/nexmesh"
env_key = "env"
entry = { command = "{mcpd}", args = [] }

[modes.headless]
args = ["--yolo", "--prompt", "{prompt}"]
attachable = false

[modes.interactive]
args = []
attachable = true

[driver]
kind = "mcp_only"

[user_install]
style = "command"
argv = ["mcp", "add", "--scope", "user", "{name}", "--", "{command}"]
env_flag = "-e"
