# Hermes Agent -- an agent CLI that is also a messaging gateway.
#
# Verified against `hermes --help`, `hermes chat --help`, `hermes mcp --help`
# and `hermes mcp add --help` on a venv install (`~/.hermes/hermes-agent`).
#
# Two things about it are unlike the other descriptors here:
#
# 1. There is NO [mcp] section. Hermes has no per-run configuration flag, so
#    nexmesh cannot hand it a config file for one conversation the way it does
#    for Claude Code. The nexmesh server is registered once in the user's own
#    `~/.hermes/config.yaml` (see [user_install]) and the SEAT is decided by
#    the environment the node sets, which the shim reads for itself.
#
#    Those variables are the ONLY channel there is. Hermes filters the
#    environment of a stdio MCP server down to an allowlist -- PATH, HOME,
#    USER, LANG, LC_ALL, TERM, SHELL, TMPDIR and XDG_* (`_SAFE_ENV_KEYS` in
#    its mcp_tool.py) -- so nothing the node sets for the hermes process
#    reaches the shim, NEXMESH_AGENT_ID included. Pin them in config.yaml or
#    the shim knows nothing: no CLI, no session, and a join the hub refuses.
#
#    The cost is that every hermes process on the machine then reports the
#    same name and conversation id and shares ONE seat. Short-lived ones --
#    `hermes chat -q`, cron jobs, webhook turns -- take that seat for a few
#    seconds each and hand it back, so a pin aimed at the team seat means
#    the team's messages wait for whichever of them is holding it. Give the
#    gateway's own turns a seat of their own (their own NEXMESH_NAME and
#    NEXMESH_CLI_SESSION) and leave the team seat to a long-lived
#    conversation.
#
# 2. There is no headless mode. `hermes chat -q` is one question per process,
#    which the fleet cannot steer mid-turn, and its agent-client protocol
#    (`hermes acp`) has not been verified here. Interactive is a real terminal
#    the fleet owns, which is what a seat needs: messages reach it by being
#    typed into its prompt, which is what `typed_delivery` below asks for.
#    Hermes has no driver, so that is its only route that does not wait for a
#    tool call it may never make.
[cli]
id = "hermes"
display_name = "Hermes Agent"
command = "hermes"
version_args = ["--version"]
# It ships into a virtualenv of its own, which is not on a login PATH.
extra_paths = ["~/.hermes/hermes-agent/venv/bin", "~/.local/bin"]
model_args = ["-m", "{model}"]

[modes.interactive]
args = ["chat"]
# `--resume SESSION_ID`, from `hermes sessions list`.
resume_args = ["--resume", "{resume}"]
attachable = true
# Typing a line at this prompt is a message to the agent, not a command
# to a shell -- so a seat the fleet put in a terminal can be reached by
# keyboard even with no driver to push to. `tmux` does not say this: what
# is at ITS prompt is a shell.
typed_delivery = true

[user_install]
# `hermes mcp add [--command CMD] [--args ...] [--env K=V ...] NAME`, with the
# name LAST. No env is passed on purpose: see the note at the top.
style = "command"
argv = ["mcp", "add", "--command", "{command}", "{name}"]
