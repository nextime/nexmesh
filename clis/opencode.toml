# opencode. Verified against 'opencode --help' / 'run --help' / 'serve --help'.
#
# opencode already has a client/server split of its own, and that turns out to
# be the best driver of the three. `opencode serve` exposes a documented API
# (OpenAPI at /doc) whose prompt endpoint takes delivery = "steer" | "queue" --
# native mid-turn steering, no stdio protocol to parse and no pty to hold.
#
# Verified against opencode 1.19.5 by reading /doc and calling the server:
#   POST /api/session                      -> { data: { id, tokens, cost } }
#   POST /api/session/{id}/prompt          { prompt: { text }, delivery }
#   GET  /api/event                        text/event-stream, 88 event types
#   POST /api/session/{id}/permission/{r}/reply  { reply: once|always|reject }
#   GET  /api/health                       -> { healthy }
# Auth is HTTP Basic with the username "opencode" and OPENCODE_SERVER_PASSWORD;
# without it the server warns that it is unsecured, and anyone with a shell on
# the machine could drive the agent through its loopback port.
[cli]
id = "opencode"
display_name = "opencode"
command = "opencode"
version_args = ["--version"]
# opencode takes a ModelRef on POST /api/session, so no flag here.
extra_paths = ["~/.opencode/bin"]

[mcp]
# Shape verified against https://opencode.ai/config.json: servers live under
# mcp.servers.<name> (the flat mcp.<name> form is deprecated), `command` is an
# ARRAY, and env goes under `environment`. A relative path makes this a project
# file in the workspace, so the user's global config is left alone.
style = "json_file"
path = "opencode.json"
pointer = "/mcp/servers/nexmesh"
env_key = "environment"
entry = { type = "local", command = ["{mcpd}"], enabled = true }

[modes.headless]
# Not `run`: a one-shot run cannot be steered. The server can.
args = ["serve", "--port", "0", "--hostname", "127.0.0.1"]
attachable = true   # `opencode attach` opens a real TUI onto the same session

[modes.interactive]
args = ["{cwd}"]
resume_args = ["--session", "{resume}"]
# `--continue` is opencode's own "continue the last session". Safe only
# because this seat has a store of its own; see the session_store section.
resume_latest_args = ["--continue"]
# No compact_command: this CLI's compaction command was not verified here --
# neither its --help nor its package names one, and the commands next to it
# (/clear, /new) are destructive, so guessing in that neighbourhood is not
# worth it. `/compact <agent>` reports that rather than typing a guess. Add
# the real command here and it works immediately.
attachable = true
# Typing a line at this prompt is a message to the agent, not a command
# to a shell -- so a seat the fleet put in a terminal can be reached by
# keyboard even with no driver to push to. `tmux` does not say this: what
# is at ITS prompt is a shell.
typed_delivery = true

[driver]
kind = "http_server"
basic_auth_user = "opencode"
password_env = "OPENCODE_SERVER_PASSWORD"
attach_args = ["attach", "{url}"]

[user_install]
# `opencode mcp add` is interactive, so it cannot be driven from a script;
# write the documented config instead. Shape verified against
# https://opencode.ai/config.json.
style = "json_file"
path = "~/.config/opencode/opencode.json"
pointer = "/mcp/servers/{name}"
env_key = "environment"
entry = { type = "local", command = ["{command}"], enabled = true }

# No [skill] section: this CLI has no skills directory to write one into. It
# gets the same ground rules through the MCP `instructions` field, which the
# hub sends every client at initialize (see proto::tools::team_instructions).

[session_store]
# A data directory per SEAT, for the same reason as codex: opencode 1.19
# exports no session id to its MCP children, names no session at launch, and
# keeps every seat's sessions in one opencode.db whose `session` rows carry a
# directory but nothing identifying the process. Two seats spawned together
# here were 610ms apart with the same cwd.
#
# XDG_DATA_HOME is the PARENT of the store, which is why store_rel names the
# subdirectory opencode appends to it.
#
# THE LOGIN IS SHARED, THE CONVERSATIONS ARE NOT.
#
# This list was empty, on the reading that opencode keeps provider credentials
# in a `credential` table inside opencode.db -- which cannot be shared without
# sharing the conversations beside it. Measured against opencode 1.19 on a host
# logged in with `opencode auth`, that table holds ZERO rows and the login is a
# separate `auth.json` in the same directory, which is an ordinary file and
# shares like any other. With the list empty, an isolated seat on such a host
# came up logged out -- so the trade was being paid without buying anything.
#
# A provider configured by API key in the environment, which is how the
# fleet's own gateway is set up, never needed either.
env = "XDG_DATA_HOME"
store_rel = "opencode"
root = "~/.local/share/opencode"
share = ["auth.json"]
