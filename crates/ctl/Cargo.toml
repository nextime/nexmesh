[package]
name = "nexmesh-ctl"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nexmesh"
path = "src/main.rs"

[dependencies]
nexmesh-proto = { workspace = true, features = ["pair-client"] }
anyhow = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
# event-stream: the console reads the keyboard inside the same async runtime
# that polls the hub, rather than blocking one of them on the other.
crossterm = { workspace = true, features = ["event-stream"] }
ratatui = { workspace = true }
tokio-tungstenite = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
webpki-roots = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
# fcntl, for a non-blocking handle on our own terminal: see `Keyboard`.
nix = { workspace = true }
