<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nexmesh · the room</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#08090d">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #08090d; color: #dfe6f2; overflow: hidden;
    font: 14px/1.5 ui-monospace, "DejaVu Sans Mono", monospace;
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(8,9,13,.92), rgba(8,9,13,0));
  }
  .bar button {
    font: inherit; padding: 9px 14px; border-radius: 9px; cursor: pointer;
    border: 1px solid #2a3040; background: #141824; color: #dfe6f2;
  }
  .bar button:hover:not(:disabled) { border-color: #4a7fd0; }
  .bar button:disabled { opacity: .45; cursor: default; }
  .bar button.go { background: #1d3a66; border-color: #2f5f9e; }
  #status {
    flex: 1 1 240px; min-width: 0; color: #9fb0c8;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hint {
    position: fixed; top: 12px; left: 14px; z-index: 2; color: #6d7d94;
    max-width: min(46ch, calc(100% - 28px));
  }
  .hint a { color: #7fa8e8; }
  /* Filmed and photographed with ?bare=1: no furniture in the picture. */
  body.bare .bar, body.bare .hint { display: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="hint">
  <strong>nexmesh</strong> · the fleet as a room.
  Drag to look, scroll to step back, click a teammate to open their terminal,
  drag a screen to move it. <a href="/">the flat dashboard</a>
</div>

<div class="bar">
  <button id="enterBtn" class="go">enter the headset</button>
  <button id="modeBtn">the code graph</button>
  <button id="menuBtn" title="the chat, and what else this can do">screens</button>
  <button id="micBtn" title="say a name to select it, or a sentence to send it">🎤 speak</button>
  <span id="status">starting…</span>
</div>

<script>
  // ?bare=1 strips the page down to the canvas, which is what the capture
  // script asks for: a screenshot of a room should be a room.
  if (new URLSearchParams(location.search).get("bare") === "1") {
    document.body.classList.add("bare");
  }
</script>
<script src="/xr.js"></script>
</body>
</html>
