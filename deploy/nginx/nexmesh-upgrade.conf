# Goes in /etc/nginx/conf.d/ — `map` must be in the http block, not a vhost.
# Needed for the WebSocket upgrade the hub uses for nodes and for attach.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# nginx has no $ssl_client_s_dn_cn: it gives the whole subject DN, so the
# common name is pulled out here. A map is the only place a variable can be
# rewritten outside a location.
#
# The DN arrives as "CN=machine-b" or "CN=machine-b,O=nexmesh" depending on
# how the certificate was issued, so the match stops at a comma or a slash.
map $ssl_client_s_dn $nexmesh_client_cn {
    default                "";
    "~CN=(?<cn>[^,/]+)"    $cn;
}
