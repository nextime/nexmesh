# nexmesh — public reverse proxy on 45.221.129.219 (bukkake secondary WAN IP).
# Fronts the nexmesh hub with TLS for nexmesh.nexlab.net. Follows the nexnet
# and homehunter vhost conventions on this host.
#
# WHY THIS PROXIES TO *HTTPS* AND NOT PLAIN LOOPBACK, unlike nexnet:
#
# The hub serves TLS on every address it listens on, because the machines that
# connect to it over the LAN must have it -- a node refuses to send its
# enrolment token in cleartext to a remote host, and that refusal is
# deliberate. So nginx talks to it over TLS too, and presents a client
# certificate because the hub requires one.
#
# That raises a subtlety the hub is built for: this connection legitimately
# presents *nginx's* certificate, not the client's. The hub would otherwise
# bind every visitor's token to the name "nginx-proxy" and refuse them all, so
# it is started with `--trusted-proxy 127.0.0.1` and believes the client
# identity forwarded below instead. That also means the hub must not be
# reachable except through here or over the LAN -- never on wan0.

# reject anything hitting .219:80 by IP / unknown name
#   (already provided by the nexnet vhost on this host; kept here as a comment
#    so this file can stand alone if that one ever goes away)
# server {
#     listen 45.221.129.219:80 default_server;
#     server_name _;
#     return 444;
# }

# http -> https (and keep serving ACME challenges for renewals)
server {
    listen 45.221.129.219:80;
    server_name nexmesh.nexlab.net;

    access_log /var/log/nginx/nexmesh-access.log;
    error_log  /var/log/nginx/nexmesh-error.log;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://nexmesh.nexlab.net$request_uri; }
}

server {
    listen 45.221.129.219:443 ssl;
    http2 on;
    server_name nexmesh.nexlab.net;

    access_log /var/log/nginx/nexmesh-access.log;
    error_log  /var/log/nginx/nexmesh-error.log;

    ssl_certificate     /etc/letsencrypt/live/nexmesh.nexlab.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexmesh.nexlab.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The fleet CA, for clients that have a certificate. `optional` rather
    # than `on` so the dashboard can be opened with a username and password by
    # someone who has none, while an operator CLI or a node coming in this way
    # still presents one and has it verified.
    ssl_client_certificate /etc/nexmesh/pki/ca-cert.pem;
    ssl_verify_client optional;
    ssl_verify_depth 2;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # The dashboard is self-contained: no CDN, no external fonts. Inline
    # script and style are its own, hence 'unsafe-inline' and nothing more.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # Matches the hub's own 16MB limit. base64 payloads to a capability bridge
    # are the reason either number is what it is.
    client_max_body_size 16m;

    location / {
        proxy_pass https://127.0.0.1:7870;
        proxy_http_version 1.1;

        # nginx's own certificate to the hub, issued by the fleet CA with
        # `nexmesh-hub pki issue nginx-proxy`.
        proxy_ssl_certificate     /etc/nexmesh/pki/nginx-proxy-cert.pem;
        proxy_ssl_certificate_key /etc/nexmesh/pki/nginx-proxy-key.pem;
        proxy_ssl_trusted_certificate /etc/nexmesh/pki/ca-cert.pem;
        proxy_ssl_verify       on;
        proxy_ssl_verify_depth 2;
        # The hub's certificate is issued for these names, not for an IP.
        proxy_ssl_name         bukkake;
        proxy_ssl_server_name  on;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # The identity nginx verified, for the hub's certificate-to-token
        # binding. The VERDICT first: nginx forwards a common name even for a
        # certificate it rejected, so the name alone would accept it.
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-CN     $ssl_client_s_dn_cn;

        # WebSockets: a node dials in and stays, and attach streams a terminal.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A node connection is long-lived, and an ask_capability call can wait
        # up to 900s for a model to run; the 60s default would cut both off.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout  1200s;
        proxy_send_timeout  1200s;
        proxy_request_buffering off;
    }

    # Deliberately NOT proxied: pairing. A machine being paired has no
    # certificate yet, so that endpoint cannot require one -- which is exactly
    # why it lives on the LAN address and never on a public name.
    location /v1/pair/claim { return 404; }
}
