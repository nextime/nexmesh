# nexmesh.nexlab.net -> the hub.
#
# READ THIS FIRST: putting a proxy in front changes where mutual TLS happens.
#
# The hub normally reads the client certificate off its own TLS handshake and
# checks that its common name matches the identity the bearer token claims --
# so a stolen token is useless without that machine's key. Behind a proxy the
# hub sees nginx's connection, not the client's, so that check has nothing to
# look at.
#
# Two ways to keep it, and you must pick one:
#
#   (a) nginx verifies the client certificate and passes the common name in a
#       header, which the hub trusts. That is what this file does. It is only
#       safe if the hub is unreachable except through nginx: a client that can
#       reach the hub directly could set the header itself and claim any
#       identity. So the hub listens on loopback here, and nothing else.
#
#   (b) nginx streams TCP through untouched (stream module, no termination)
#       and the hub keeps doing its own mutual TLS. More faithful, but then
#       this is not an HTTP vhost and the dashboard shares the hub's own
#       certificate rather than a public one.
#
# This file is (a): a public name with a real certificate for the dashboard,
# with the fleet CA still gating who may connect.

upstream nexmesh_hub {
    # The hub MUST be loopback-only for this to be safe. See above. Start it
    # with:
    #   nexmesh-hub --listen 127.0.0.1:7870 --trusted-proxy 127.0.0.1 \
    #               --pair-listen 192.168.42.44:7871 serve
    # No --tls-cert here: nginx terminates. No --client-ca either; nginx does
    # the verifying and forwards the verdict.
    server 127.0.0.1:7870;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name nexmesh.nexlab.net;
    # Leave the ACME path alone; everything else goes to TLS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # The public address is reached only through here. The hub itself listens
    # on 127.0.0.1 and speaks plain HTTP, so nginx owns every bit of TLS --
    # one certificate story instead of two, and the hub is unreachable except
    # through this file.
    #
    # LAN machines come through here too. Routing a node on the same switch
    # out to a public name and back looks wasteful, but it means one
    # authentication path rather than two, and one place where a mistake can
    # be made.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nexmesh.nexlab.net;

    # The public certificate, for browsers.
    ssl_certificate     /etc/letsencrypt/live/nexmesh.nexlab.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexmesh.nexlab.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:nexmesh:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # The fleet CA, for clients. `optional` rather than `on` so the dashboard
    # can be opened with a username and password by someone who has no
    # certificate, while nodes and the operator CLI still present one and get
    # it checked. Set it to `on` if you want the certificate to be mandatory
    # for every request, dashboard included.
    ssl_client_certificate /etc/nexmesh/pki/ca-cert.pem;
    ssl_verify_client optional;
    ssl_verify_depth 2;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # The dashboard is self-contained -- no CDN, no external fonts -- so this
    # can be strict. 'unsafe-inline' is needed only because its script and
    # styles are inline in the single page it serves.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # Matches the hub's own 16MB body limit: base64 payloads to a capability
    # bridge are the reason either number is what it is.
    client_max_body_size 16m;

    access_log /var/log/nginx/nexmesh.access.log;
    error_log  /var/log/nginx/nexmesh.error.log;

    location / {
        proxy_pass http://nexmesh_hub;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The identity nginx verified, for the hub's certificate-to-token
        # binding. SUCCESS first: without it a client could present an
        # untrusted certificate and still have its CN forwarded.
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-CN     $ssl_client_s_dn_cn;
        # Never let a client set these itself.
        proxy_set_header X-Client-Cert   "";

        # WebSockets: nodes dial in and stay, and attach streams a terminal.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A node connection is long-lived and an ask_capability call can wait
        # up to 900s for a model to run, so the default 60s would cut both off
        # mid-flight.
        proxy_read_timeout  1200s;
        proxy_send_timeout  1200s;
        proxy_buffering     off;
        proxy_request_buffering off;
    }

    # Deliberately NOT proxied: the pairing listener. A machine being paired
    # has no certificate yet, so that endpoint cannot require one -- which is
    # exactly why it must stay on the LAN or the VPN and never appear here.
    location /v1/pair/claim { return 404; }
}
